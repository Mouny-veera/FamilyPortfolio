# Raises the request body limit for Excel imports.
#
# Installed to /etc/nginx/conf.d/ rather than edited into the site config,
# because certbot owns that file — it rewrote it to add TLS, and overwriting it
# with the copy in this repo would remove HTTPS. Debian's nginx.conf includes
# conf.d/*.conf inside the http block, and client_max_body_size is valid there,
# so this applies to every server without touching the certbot-managed config.
#
# nginx defaults to 1m, which rejects a normal holdings workbook with a 413
# before the request ever reaches the application.
client_max_body_size 10m;
